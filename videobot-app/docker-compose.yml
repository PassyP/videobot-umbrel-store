# umbrelOS 2.0: app_proxy is a declaration only (the gateway reads APP_HOST/APP_PORT);
# no other service may reference it. V1 is ONE service (single process, SQLite).
services:
  app_proxy:
    environment:
      APP_HOST: videobot-app_app_1
      APP_PORT: 8000
      # The discovery engine (ADR 0009) calls /api/* with a bearer token; Umbrel's login would
      # otherwise answer with its own HTML page. VAP authenticates /api/ itself (web/api_auth.py).
      PROXY_AUTH_WHITELIST: "/api/*"

  app:
    # Digest pinning: the release workflow fills in the owner of the image name and the sha256 (multi-arch index digest).
    image: ghcr.io/passyp/videobot:0.1.6@sha256:1bf38aa6c3be27a0b53575fcd9cb154154dd0fed841ead99a1fa84951af6ce38
    user: "1000:1000"
    init: true
    restart: on-failure
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: Europe/Amsterdam
      VAP_DATA_DIR: /data
      # Setup code for the first-run wizard = the password Umbrel shows for this app.
      VAP_SETUP_CODE: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data:/data
