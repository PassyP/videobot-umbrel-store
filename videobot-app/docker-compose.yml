# umbrelOS 2.0: app_proxy is a declaration only (the gateway reads APP_HOST/APP_PORT);
# no other service may reference it. V1 is ONE service (single process, SQLite).
services:
  app_proxy:
    environment:
      APP_HOST: videobot-app_app_1
      APP_PORT: 8000

  app:
    # Digest pinning: the release workflow fills in the owner of the image name and the sha256 (multi-arch index digest).
    image: ghcr.io/passyp/videobot:0.1.3@sha256:fab4281143d3a999af3a0a312a6807edd8e3bbbb53c08143bbe913d29f9f391c
    user: "1000:1000"
    init: true
    restart: on-failure
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: Europe/Amsterdam
      VAP_DATA_DIR: /data
      # Setup code for the first-run wizard = the password Umbrel shows for this app.
      VAP_SETUP_CODE: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data:/data
